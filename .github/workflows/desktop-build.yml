name: Desktop build

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            packages: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-arm64
            runner: macos-15
            packages: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macos-x64
            runner: macos-15-intel
            packages: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Generate desktop icons
        run: npm run tauri -- icon app-icon.png
      - name: Build the desktop application and installers
        run: npm run tauri:build
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Check the built UI for credential material
        run: npm run check:bundle
      - name: Upload installer candidates
        uses: actions/upload-artifact@v4
        with:
          name: yuna-${{ matrix.platform }}-installers
          path: ${{ matrix.packages }}
          if-no-files-found: error
